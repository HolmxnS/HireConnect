<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="chatbot" class="hc-chat-root" th:attr="data-chat-user=${postulante?.id},data-chat-name=${postulante?.nombre}">
<link rel="stylesheet" th:href="@{/styles/fragments/postulante/chatbot.css}"/>
<button type="button" id="hcChatToggle" class="hc-chat__toggle" aria-label="Abrir asistente HireConnect" aria-controls="hcChatPanel" aria-expanded="false"><span class="hc-chat__spark" aria-hidden="true">✦</span><span>Tu asistente</span></button>
<section id="hcChatPanel" class="hc-chat__panel" role="dialog" aria-labelledby="hcChatTitle" hidden>
<header class="hc-chat__header"><div class="hc-chat__title"><span class="hc-chat__avatar" aria-hidden="true">✦</span><div><strong id="hcChatTitle">Asistente HireConnect</strong><small>Tu próximo paso, más claro</small></div></div><div class="hc-chat__actions"><button type="button" id="hcChatClear" aria-label="Nueva conversación" title="Nueva conversación">↻</button><button type="button" id="hcChatExpand" aria-label="Ampliar conversación" aria-pressed="false" title="Ampliar">↗</button><button type="button" id="hcChatClose" aria-label="Cerrar asistente" title="Cerrar">×</button></div></header>
<div id="hcChatMessages" class="hc-chat__messages" role="log" aria-label="Conversación" aria-live="polite" aria-relevant="additions"></div>
<div class="hc-chat__suggestions" id="hcChatChips" aria-label="Preguntas sugeridas"></div>
<p class="hc-chat__status" id="hcChatStatus" role="status" aria-live="polite"></p>
<form class="hc-chat__form" id="hcChatForm"><label for="hcChatInput" class="hc-chat__sr">Tu mensaje</label><div class="hc-chat__composer"><textarea id="hcChatInput" maxlength="1000" rows="1" placeholder="¿En qué te ayudo hoy?" autocomplete="off" aria-describedby="hcChatCounter"></textarea><button type="submit" id="hcChatSend" aria-label="Enviar mensaje" disabled>↑</button><button type="button" id="hcChatStop" aria-label="Detener espera" title="Detener" hidden>■</button></div><div class="hc-chat__hint"><span>Enter para enviar · Mayús + Enter para nueva línea</span><span id="hcChatCounter">0/1000</span></div></form>
</section>
<script th:src="@{/js/chatbot.js}" th:attr="data-endpoint=@{/postulante/chat}"></script>
</div></body></html>
