<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      th:href="@{/styles/fragments/postulante/header.css}"
    />
      <link rel="stylesheet" th:href="@{/styles/brand.css}" />
</head>

  <body>
    <!-- mostrarBusqueda activa el buscador; sidebar_postulante carga el JS de este layout. -->
    <header th:fragment="menu-fragment(mostrarBusqueda)">
      <div class="header-container" th:classappend="${mostrarBusqueda} ? 'header-container--search' : ''">
        <div class="header-content">
          <div th:if="${mostrarBusqueda}" class="search-wrapper">
            <div class="search-main">
              <div class="search-bar-google">
                <form
                  id="searchForm"
                  method="get"
                  th:action="@{/postulante/vacantes/listar}"
                  autocomplete="off"
                  role="search"
                >
                  <button
                    type="submit"
                    class="search-btn"
                    aria-label="Buscar vacantes"
                  >
                    <span class="search-btn__icon"
                      ><i class="fa-solid fa-magnifying-glass"></i
                    ></span>
                  </button>
                  <input
                    type="text"
                    id="buscador"
                    name="filtro"
                    placeholder="Cargo o palabra clave"
                    aria-label="Buscar vacantes"
                    th:value="${filtro}"
                  />
                </form>


              </div>

              <div id="historial" class="historial-dropdown">
                <div class="historial-header">
                  <span>Búsquedas recientes</span>
                  <button type="button" id="limpiar-historial">Limpiar</button>
                </div>
                <ul id="lista-historial"></ul>
              </div>
            </div>
          </div>

          <div class="topbar-actions">
            <button
              type="button"
              class="topbar__btn topbar__theme"
              data-theme-toggle
              aria-label="Cambiar tema"
              title="Cambiar tema"
            >
              <span class="topbar__theme-icon topbar__theme-icon--moon"
                ><i class="fa-solid fa-moon"></i
              ></span>
              <span class="topbar__theme-icon topbar__theme-icon--sun"
                ><i class="fa-solid fa-sun"></i
              ></span>
            </button>

            <!-- Notificaciones: el JS (layout_postulante.js) las carga desde /postulante/notificaciones -->
            <div
              class="notif"
              data-notif
              th:attr="data-url=@{/postulante/notificaciones},data-csrf=${_csrf != null ? _csrf.token : ''}"
            >
              <button
                type="button"
                class="topbar__btn notif__btn"
                id="notifBtn"
                aria-label="Notificaciones"
                title="Notificaciones"
                aria-haspopup="true"
                aria-expanded="false"
                aria-controls="notifPanel"
              >
                <span class="topbar__btn-icon"
                  ><i class="fa-regular fa-bell"></i
                ></span>
                <span class="notif__badge" id="notifBadge" hidden>0</span>
              </button>

              <div
                class="notif__panel"
                id="notifPanel"
                role="dialog"
                aria-label="Notificaciones"
                hidden
              >
                <div class="notif__head">
                  <h2 class="notif__title">Notificaciones</h2>
                  <button
                    type="button"
                    class="notif__readall"
                    id="notifReadAll"
                    disabled
                  >
                    Marcar todas como leídas
                  </button>
                </div>
                <ul class="notif__list" id="notifList"></ul>
                <div class="notif__empty" id="notifEmpty">
                  <span class="notif__empty-icon"
                    ><i class="fa-regular fa-bell-slash"></i
                  ></span>
                  <p class="notif__empty-title">Todo al día</p>
                  <p class="notif__empty-text">
                    Aquí verás cuando cambie el estado de tus postulaciones.
                  </p>
                </div>
              </div>
            </div>

            <div class="profile-box">
              <a
                th:href="@{/postulante/perfil}"
                th:attr="aria-label=${postulante != null} ? 'Mi perfil · En línea' : 'Mi perfil',title=${postulante != null} ? 'Mi perfil · En línea' : 'Mi perfil'"
              >
                <img
                  th:if="${postulante?.foto != null}"
                  th:src="${postulante.foto}"
                  alt="Perfil"
                />
                <div
                  th:unless="${postulante?.foto != null}"
                  class="profile-box__placeholder"
                >
                  <i class="fa-solid fa-user"></i>
                </div>
                <span th:if="${postulante != null}" class="profile-box__online" aria-hidden="true"></span>
              </a>
            </div>
          </div>
        </div>

      </div>
    </header>
  </body>
</html>
