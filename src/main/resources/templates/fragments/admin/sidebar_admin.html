<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><body>
    <th:block th:fragment="sidebar (activeMenu)">

        <!--Aplica el estado plegado antes de pintar para que no haya parpadeo (solo en escritorio)-->
        <script>
            (function () {
                try {
                    if (window.matchMedia('(min-width: 901px)').matches && localStorage.getItem('hc-sidebar') === 'collapsed') {
                        document.documentElement.classList.add('is-sidebar-collapsed');
                    }
                } catch (e) { }
            })();
        </script>

        <button type="button" class="sidebar-opener" id="sidebarOpener" aria-label="Abrir menú" aria-controls="sidebar"
            aria-expanded="false">
            <span class="sidebar-opener__icon"><i class="fa-solid fa-bars"></i></span>
        </button>

        <aside class="sidebar" id="sidebar" aria-label="Menú principal">

            <div class="sidebar__logo">
                <button type="button" class="sidebar__toggle" id="sidebarToggle" aria-label="Ocultar menú"
                    aria-controls="sidebar" aria-expanded="true">
                    <span class="sidebar__toggle-icon"><i class="fa-solid fa-bars"></i></span>
                </button>
                <a class="sidebar__brand" th:href="@{/admin/dashboard}" aria-label="HireConnect, ir al inicio">
                    <span class="hc-logo-mark" aria-hidden="true"><img th:src="@{/source/img/isotipo.png}" alt="" /></span>
                    <span class="sidebar__brand-name">Hire<span class="sidebar__highlight">Connect</span></span>
                </a>
            </div>

            <nav class="sidebar__nav" aria-label="Navegación de administración">
                <ul>
                    <li>
                        <a th:href="@{/admin/dashboard}" class="sidebar__link" data-label="Inicio"
                            th:classappend="${activeMenu == 'home'} ? 'sidebar__active'"
                            th:attr="aria-current=${activeMenu == 'home'} ? 'page'">
                            <span class="sidebar__icon"><i class="fa-solid fa-house"></i></span>
                            <span class="sidebar__text">Inicio</span>
                        </a>
                    </li>

                    <li><a th:href="@{/admin/empresas}" class="sidebar__link" data-label="Empresas" th:classappend="${activeMenu == 'empresas'} ? 'sidebar__active'" th:attr="aria-current=${activeMenu == 'empresas'} ? 'page'"><span class="sidebar__icon"><i class="fa-solid fa-briefcase"></i></span><span class="sidebar__text">Empresas</span></a></li>
                    <li>
                        <a th:href="@{/admin/postulantes}" class="sidebar__link" data-label="Postulantes"
                            th:classappend="${activeMenu == 'postulantes'} ? 'sidebar__active'"
                            th:attr="aria-current=${activeMenu == 'postulantes'} ? 'page'">
                            <span class="sidebar__icon"><i class="fa-solid fa-clipboard-list"></i></span>
                            <span class="sidebar__text">Postulantes</span>
                        </a>
                    </li>

                    <li><a th:href="@{/admin/vacantes}" class="sidebar__link" data-label="Vacantes" th:classappend="${activeMenu == 'vacantes'} ? 'sidebar__active'" th:attr="aria-current=${activeMenu == 'vacantes'} ? 'page'"><span class="sidebar__icon"><i class="fa-solid fa-briefcase"></i></span><span class="sidebar__text">Vacantes</span></a></li>
                    <li>
                        <a th:href="@{/admin/editar}" class="sidebar__link" data-label="Mi Perfil"
                            th:classappend="${activeMenu == 'perfil'} ? 'sidebar__active'"
                            th:attr="aria-current=${activeMenu == 'perfil'} ? 'page'">
                            <span class="sidebar__icon"><i class="fa-solid fa-user-gear"></i></span>
                            <span class="sidebar__text">Mi Perfil</span>
                        </a>
                    </li>

                    <li>
                        <a th:href="@{/admin/configuracion}" class="sidebar__link" data-label="Configuración"
                            th:classappend="${activeMenu == 'configuracion'} ? 'sidebar__active'"
                            th:attr="aria-current=${activeMenu == 'configuracion'} ? 'page'">
                            <span class="sidebar__icon"><i class="fa-solid fa-gear"></i></span>
                            <span class="sidebar__text">Configuración</span>
                        </a>
                    </li>

                    <li class="sidebar__bottom">
                        <form th:action="@{/logout}" method="post" class="sidebar__logout-form">
                            <button type="submit" class="sidebar__link sidebar__logout" data-label="Cerrar Sesión" aria-label="Cerrar sesión">
                                <span class="sidebar__icon"><i class="fa-solid fa-right-from-bracket"></i></span>
                                <span class="sidebar__text">Cerrar Sesión</span>
                            </button>
                        </form>
                    </li>
                </ul>
            </nav>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <dialog class="admin-confirm" data-admin-dialog aria-labelledby="admin-confirm-title"><h2 id="admin-confirm-title">Confirmar acción</h2><p data-admin-confirm-message></p><div><button type="button" data-admin-cancel>Cancelar</button><a data-admin-proceed>Confirmar</a></div></dialog>
        <script th:src="@{/js/layout_postulante.js}" defer></script>
        <script th:src="@{/js/toasts.js}" defer></script>
        <script th:src="@{/js/admin_workspace.js}" defer></script>
    </th:block>
</body></html>
