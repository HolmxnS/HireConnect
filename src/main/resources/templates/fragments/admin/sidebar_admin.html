<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/styles/fragments/empresa/sidebar.css}">
    <link rel="stylesheet" th:href="@{/styles/satoshi.css}">
    <link rel="stylesheet" th:href="@{/styles/clash-display.css}">
    <script src="https://kit.fontawesome.com/e71256cba2.js" crossorigin="anonymous"></script>
    <title>Dashboard Administrador</title>
</head>

<body>

    <aside th:fragment="sidebar (activeMenu)" class="sidebar">

        <div class="sidebar__logo">
            <h1>Hire<span class="sidebar__highlight">Connect</span></h1>
        </div>

        <nav class="sidebar__nav">
            <ul>
                <li>
                    <a th:href="@{/admin/dashboard}" class="sidebar__link" title="Inicio" aria-label="Inicio"
                        th:classappend="${activeMenu == 'home'} ? 'sidebar__active' : ''">
                        <i class="fa-solid fa-house"></i> <span class="sidebar__text">Inicio</span>
                    </a>
                </li>

                <li>
                    <a th:href="@{/admin/empresas}" title="Empresas" aria-label="Empresas"
                        th:classappend="${activeMenu == 'empresas'} ? 'sidebar__active' : ''">
                        <i class="fa-solid fa-briefcase"></i> <span class="sidebar__text">Empresas</span>
                    </a>
                </li>

                <li>
                    <a th:href="@{/admin/postulantes}" title="Postulantes" aria-label="Postulantes"
                        th:classappend="${activeMenu == 'postulantes'} ? 'sidebar__active' : ''">
                        <i class="fa-solid fa-user"></i> <span class="sidebar__text">Postulantes</span>
                    </a>
                </li>

                <li>
                    <a th:href="@{/admin/resumen}" title="Resumen" aria-label="Resumen" 
                        th:classappend="${activeMenu == 'resumen'} ? 'sidebar__active' : ''">
                        <i class="fa-solid fa-chart-line"></i> <span class="sidebar__text">Resumen</span>
                    </a>
                </li>

                <li>
                    <a th:href="@{/admin/editar}" title="Mi Perfil" aria-label="Mi Perfil" th:classappend="${activeMenu == 'perfil'} ? 'sidebar__active' : ''">
                        <i class="fa-solid fa-user-gear"></i> <span class="sidebar__text">Mi Perfil</span>
                    </a>
                </li>


                <li>
                    <a th:href="@{/logout}" class="sidebar__logout" title="Cerrar Sesión" aria-label="Cerrar Sesión">
                        <i class="fa-solid fa-right-from-bracket"></i> <span class="sidebar__text">Cerrar Sesión</span>
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

</body>

</html>
