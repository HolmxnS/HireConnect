<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Header Administrador</title>
</head>

<body>

    <header class="topbar" th:fragment="topbar (title, subtitle)">

        <div class="topbar__text">
            <h1 class="topbar__title" th:text="${title}">Título</h1>
            <p class="topbar__subtitle" th:if="${not #strings.isEmpty(subtitle)}" th:text="${subtitle}">Subtítulo</p>
        </div>

        <div class="topbar__actions">

            <div class="notification">
                <button type="button" class="notification__icon" id="notifToggle" aria-label="Notificaciones">
                    <i class="fa-solid fa-bell"></i>
                    <span class="notification__badge" th:if="${notificacionesNuevas > 0}"
                        th:text="${notificacionesNuevas}">0</span>
                </button>

                <div class="notification__panel hidden" id="notifPanel">

                    <div class="notification__header">
                        <span>Notificaciones</span>
                        <div class="notification__actions">
                            <a href="#" id="markAllRead">Marcar todas</a>
                            <a href="#" id="deleteAll" class="danger-header">Eliminar todas</a>
                        </div>
                    </div>

                    <div class="notification__content">
                        <div class="notification__item" th:each="n : ${notificacion}"
                            th:classappend="${n.leida} ? 'read' : 'unread'" th:attr="data-id=${n.id}">

                            <div class="notification__icon-text">
                                <div th:if="${T(com.project.HireConnect.dto.Notificacion.TipoNotificacion).POSTULANTE.equals(n.tipo)}"
                                    class="notification__type postulante">
                                    <i class="fa-solid fa-user"></i>
                                </div>
                                <div th:if="${T(com.project.HireConnect.dto.Notificacion.TipoNotificacion).EMPRESA.equals(n.tipo)}"
                                    class="notification__type empresa">
                                    <i class="fa-solid fa-building"></i>
                                </div>

                                <div class="notification__text">
                                    <strong th:text="${n.nombreRelacionado}"></strong>
                                    <span th:text="${n.mensaje}"></span>
                                    <small th:text="${#temporals.format(n.fecha, 'dd/MM/yyyy HH:mm')}"></small>
                                </div>
                            </div>

                            <div class="notification__menu">
                                <button type="button" class="mark-one">Marcar como leída</button>
                                <button type="button" class="delete-one danger">Eliminar</button>
                            </div>
                        </div>

                        <div class="notification__empty" th:if="${#lists.isEmpty(notificacion)}">
                            <i class="fa-regular fa-bell-slash"></i>
                            <span>No tienes notificaciones.</span>
                        </div>
                    </div>
                </div>
            </div>

            <a class="topbar__avatar" th:href="@{/admin/editar}" title="Mi perfil" aria-label="Mi perfil">
                <img th:if="${admin.foto != null and admin.foto != ''}" th:src="@{${admin.foto}}" alt="Foto de perfil">
                <span th:if="${admin.foto == null or admin.foto == ''}" class="topbar__avatar-placeholder">
                    <i class="fa-solid fa-user"></i>
                </span>
            </a>
        </div>
    </header>

</body>

</html>
