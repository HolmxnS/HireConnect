<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/styles/postulante/registro_postulante.css}" />
    <link rel="stylesheet" th:href="@{/styles/satoshi.css}" />
    <link rel="stylesheet" th:href="@{/styles/clash-display.css}" />
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/source/img/hireconnect.png}">
    <script src="https://kit.fontawesome.com/e71256cba2.js" crossorigin="anonymous"></script>
    <title>Registro - Postulante</title>
</head>

<body>

    <div class="container">

        <div class="hero">
            <h2 class="hero__title">El trabajo que buscas, más cerca de lo que crees.</h2>
            <p class="hero__info">Descubre ofertas reales de empresas verificadas y da el siguiente paso en tu carrera
                con solo unos clics.
            </p>
        </div>

        <div class="form-panel">

            <header class="header">
                <div class="header__logo">
                    <a th:href="@{/}">
                        <h1>Hire<span class="header__logo-higlight">Connect</span></h1>
                    </a>
                </div>
                <span class="header__step">Paso 1 de 3</span>
            </header>

            <main class="main">

                <div class="register">
                    <h2 class="register__title">Registro</h2>
                    <div class="register__underline"></div>
                    <p class="register__subtitle">Por favor, ingrese sus datos para crear una cuenta</p>

                    <form id="register-form" class="register__form" th:action="@{/register/postulante}"
                        th:object="${postulante}" method="post" novalidate>

                        <input type="hidden" id="currentStep" name="step" value="1" />

                        <div id="step-1">

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="nombre">Nombres</label>
                                    <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej: Juan"
                                        required />
                                    <p class="error" th:if="${#fields.hasErrors('nombre')}"
                                        th:text="${#fields.errors('nombre')[0]}"></p>
                                </div>
                                <div class="form-group">
                                    <label for="apellido">Apellidos</label>
                                    <input type="text" id="apellido" th:field="*{apellido}" placeholder="Ej: Vargas"
                                        required />
                                    <p class="error" th:if="${#fields.hasErrors('apellido')}"
                                        th:text="${#fields.errors('apellido')[0]}">
                                    </p>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">

                                    <label>Tipo de documento</label>
                                    <div class="select-wrapper">
                                        <select th:field="*{tipoDocumento}" required>
                                            <option value="">— Selecciona tipo —</option>
                                            <option value="CEDULA">Cédula de Ciudadanía</option>
                                            <option value="PASAPORTE">Pasaporte</option>
                                            <option value="OTRO">Otro</option>
                                        </select>
                                        <i class="fa-solid fa-chevron-down select-icon"></i>
                                    </div>
                                    <p class="error" th:if="${#fields.hasErrors('tipoDocumento')}"
                                        th:text="${#fields.errors('tipoDocumento')[0]}">
                                    </p>
                                </div>
                                <div class="form-group">
                                    <label>Número de identificación</label>
                                    <input type="text" th:field="*{identificacion}"
                                        placeholder="Tu número de identificación" required />
                                    <p class="error" th:if="${#fields.hasErrors('identificacion')}"
                                        th:text="${#fields.errors('identificacion')[0]}">
                                    </p>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="fecha">Fecha de nacimiento</label>
                                    <input type="date" id="fecha" th:field="*{fechaNacimiento}" required
                                        max="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}" />
                                    <p class="error" th:if="${#fields.hasErrors('fechaNacimiento')}"
                                        th:text="${#fields.errors('fechaNacimiento')[0]}">
                                    </p>
                                </div>
                                <div class="form-group">
                                    <label for="genero">Género</label>
                                    <div class="select-wrapper">
                                        <select id="genero" th:field="*{genero}" required>
                                            <option value="">— Selecciona género —</option>
                                            <option value="MASCULINO">Masculino</option>
                                            <option value="FEMENINO">Femenino</option>
                                        </select>
                                        <i class="fa-solid fa-chevron-down select-icon"></i>
                                    </div>
                                    <p class="error" th:if="${#fields.hasErrors('genero')}"
                                        th:text="${#fields.errors('genero')[0]}"></p>
                                </div>
                            </div>

                            <button type="submit" class="btn-submit">
                                Continuar <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </div>

                        <div id="step-2">
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="email">Email</label>
                                    <input type="email" id="email" th:field="*{email}" placeholder="correo@ejemplo.com"
                                        required />
                                    <p class="error" th:if="${#fields.hasErrors('email')}"
                                        th:text="${#fields.errors('email')[0]}"></p>
                                </div>
                                <div class="form-group">
                                    <label for="telefono">Teléfono</label>
                                    <input type="text" id="telefono" th:field="*{telefono}" placeholder="Ej: 3212392010"
                                        required />
                                    <p class="error" th:if="${#fields.hasErrors('telefono')}"
                                        th:text="${#fields.errors('telefono')[0]}">
                                    </p>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="password">Contraseña</label>
                                    <div class="input-password-wrapper">
                                        <input type="password" id="password" th:field="*{password}"
                                            placeholder="Crea una contraseña segura" required />
                                        <button type="button" class="toggle-password" onclick="togglePassword()">
                                            <i class="fa-regular fa-eye" id="eye-icon"></i>
                                        </button>
                                    </div>
                                    <p class="error" th:if="${#fields.hasErrors('password')}"
                                        th:text="${#fields.errors('password')[0]}">
                                    </p>
                                </div>
                                <div class="form-group">
                                    <label for="confirmPassword">Confirmar contraseña</label>
                                    <div class="input-password-wrapper">
                                        <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                                            placeholder="Ingrese su contraseña nuevamente" required />
                                        <button type="button" class="toggle-password" onclick="toggleConfirmPassword()">
                                            <i class="fa-regular fa-eye" id="eye-icon-confirm"></i>
                                        </button>
                                    </div>
                                    <p class="error" th:if="${#fields.hasErrors('confirmPassword')}"
                                        th:text="${#fields.errors('confirmPassword')[0]}"></p>
                                </div>
                            </div>

                            <button type="submit" class="btn-submit">
                                Crear Cuenta <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </div>

                    </form>

                    <div class="card__footer">
                        <p>¿Ya tienes una cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
                    </div>
                </div>
            </main>
        </div>

    </div>

    <script th:inline="javascript">
        window.mostrarPaso2 = /*[[${mostrarPaso2}]]*/ false;
    </script>

    <script th:src="@{/js/registro_postulante.js}"></script>
</body>

</html>
