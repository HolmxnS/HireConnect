<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/styles/fragments/postulante/sidebar.css}" />
    <link rel="stylesheet" th:href="@{/styles/fragments/postulante/header.css}" />
    <link rel="stylesheet" th:href="@{/styles/postulante/theme.css}" />
    <link rel="stylesheet" th:href="@{/styles/postulante/mis_postulaciones.css}" />
    <link rel="stylesheet" th:href="@{/styles/postulante/detalle_postulacion.css}" />
    <script th:src="@{/js/theme.js}"></script>
    <link rel="stylesheet" th:href="@{/styles/satoshi.css}" />
    <link rel="stylesheet" th:href="@{/styles/clash-display.css}" />
    <link rel="stylesheet" th:href="@{/styles/brand.css}" />
    <link rel="icon" type="image/svg+xml" sizes="any" th:href="@{/source/img/favicon.svg}" />
    <script src="https://kit.fontawesome.com/e71256cba2.js" crossorigin="anonymous" defer></script>
    <title>Detalle de la postulación | HireConnect</title>
</head>
<body class="applications-page application-detail-page">
    <div th:replace="~{fragments/postulante/sidebar_postulante :: sidebar('postulaciones')}"></div>
    <div th:replace="~{fragments/postulante/header_postulante :: menu-fragment(false)}"></div>
    <main class="main applications">
        <article class="application-detail-page__card" aria-labelledby="application-detail-page-title">
            <header class="application-detail-page__header">
                <a class="application-detail-page__back" th:href="@{/postulante/postulaciones}"><span aria-hidden="true">←</span> Mis postulaciones</a>
                <h1 id="application-detail-page-title">Detalle de la postulación</h1>
            </header>
            <div class="application-detail-page__body">
                <!-- Comparte contenido y estilos con el panel para evitar dos versiones del detalle. -->
                <div th:replace="~{postulante/fragments/detalle_postulacion_panel :: contenido}"></div>
            </div>
        </article>
    </main>
</body>
</html>
