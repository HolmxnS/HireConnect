<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/styles/fragments/empresa/sidebar.css}">
    <link rel="stylesheet" th:href="@{/styles/empresa/theme.css}">
    <script th:src="@{/js/theme.js}"></script>
    <link rel="stylesheet" th:href="@{/styles/satoshi.css}">
    <link rel="stylesheet" th:href="@{/styles/clash-display.css}">
    <link rel="icon" type="image/svg+xml" sizes="any" th:href="@{/source/img/favicon.svg}">
    <script src="https://kit.fontawesome.com/e71256cba2.js" crossorigin="anonymous"></script>

    <title>Postulaciones - Revisión</title>
    <link rel="stylesheet" th:href="@{/styles/brand.css}" />
    <link rel="stylesheet" th:href="@{/styles/empresa/layout.css}" />
    <link rel="stylesheet" th:href="@{/styles/empresa/reclutamiento.css}" />
    <link rel="stylesheet" th:href="@{/styles/toasts.css}" />
</head>


<body class="company-recruit">
  <div th:replace="~{fragments/empresa/sidebar_empresa :: sidebar('postulaciones')}"></div>
  <div th:replace="~{fragments/empresa/header_empresa :: header}"></div>
  <main class="main recruit-page">
    <header class="recruit-heading"><div><h1>Postulaciones</h1><p>Revisa los candidatos de cada vacante.</p></div><a class="recruit-secondary" th:href="@{/empresa/vacantes}">Gestionar vacantes ↗</a></header>
    <p th:if="${exito}" th:text="${exito}" class="success" data-toast-message hidden></p><p th:if="${error}" th:text="${error}" class="error" data-toast-message hidden></p>
    <div class="recruit-board" data-recruit-workspace th:data-company-id="${empresa.id}" th:data-selected-id="${vacanteSeleccionadaId}">
      <section class="recruit-vacancies" aria-label="Vacantes de la empresa">
        <div class="recruit-vacancy-filters"><input type="search" data-job-search placeholder="Buscar vacante…" aria-label="Buscar vacante" /><select data-job-state aria-label="Estado de la vacante"><option value="">Todos los estados</option><option value="ACTIVA">Activas</option><option value="PENDIENTE">Pendientes</option><option value="CERRADA">Cerradas</option></select></div>
        <p class="recruit-count" data-job-count role="status" aria-live="polite" th:text="${#lists.size(vacantesActivas) + ' vacantes'}"></p>
        <div class="recruit-job-list">
          <a th:each="vacante : ${vacantesActivas}" class="recruit-job" th:classappend="${vacante.id == vacanteSeleccionadaId} ? 'is-selected'" th:href="@{/empresa/postulaciones/lista/{id}(id=${vacante.id})}" th:data-job-id="${vacante.id}" th:data-state="${vacante.estado?.name() ?: ''}" th:attr="aria-current=${vacante.id == vacanteSeleccionadaId} ? 'true'" data-job-open>
            <span class="recruit-job__logo"><img th:if="${not #strings.isEmpty(empresa.foto)}" th:src="${empresa.foto}" alt="" loading="lazy" /><i th:if="${#strings.isEmpty(empresa.foto)}" class="fa-solid fa-briefcase" aria-hidden="true"></i></span>
            <span class="recruit-job__body"><strong data-job-title th:text="${vacante.titulo ?: 'Vacante sin título'}"></strong><span class="recruit-job__meta"><span th:if="${vacante.modalidad != null}" th:text="${vacante.modalidad.descripcion}"></span><span th:if="${vacante.tipoContrato != null}" th:text="${vacante.tipoContrato.descripcion}"></span></span><time th:if="${vacante.fechaPublicacion != null}" th:text="${#temporals.format(vacante.fechaPublicacion, 'dd MMM yyyy')}"></time></span>
            <span class="recruit-job__stats"><strong th:text="${vacante.totalPostulaciones}"></strong><span>postulaciones</span><span class="recruit-job__state" th:text="${vacante.estado != null ? (vacante.estado.name() == 'ACTIVA' ? 'Activa' : (vacante.estado.name() == 'CERRADA' ? 'Cerrada' : 'Pendiente')) : 'Sin estado'}"></span></span>
          </a>
          <div class="recruit-empty" th:if="${#lists.isEmpty(vacantesActivas)}"><h2>Aún no has publicado vacantes</h2><p>Publica una oferta para empezar a recibir candidatos.</p><a class="recruit-primary" th:href="@{/empresa/vacantes/nueva}">Publicar vacante</a></div>
          <p class="recruit-filter-empty" data-job-empty hidden>No hay vacantes que coincidan con tu búsqueda.</p>
        </div>
      </section>
      <section class="recruit-candidate-pane" aria-label="Postulantes de la vacante" data-candidate-pane><div th:replace="~{fragments/empresa/candidatos :: lista}"></div></section>
    </div>
  </main>
  <dialog class="recruit-drawer" aria-label="Detalle del postulante" data-candidate-dialog><div class="recruit-drawer__bar"><span>Perfil del postulante</span><button type="button" data-candidate-close aria-label="Cerrar perfil">×</button></div><div class="recruit-drawer__content" data-candidate-detail></div></dialog>
  <script th:src="@{/js/toasts.js}" defer></script>
  <script th:src="@{/js/listado_postulaciones.js}" defer></script>
</body>
</html>
