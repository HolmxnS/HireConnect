<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/styles/fragments/empresa/sidebar.css}">
    <link rel="stylesheet" th:href="@{/styles/empresa/theme.css}">
    <script th:src="@{/js/theme.js}"></script>
    <link rel="stylesheet" th:href="@{/styles/satoshi.css}">
    <link rel="stylesheet" th:href="@{/styles/clash-display.css}">
    <link rel="icon" type="image/svg+xml" sizes="any" th:href="@{/source/img/favicon.svg}">
    <script src="https://kit.fontawesome.com/e71256cba2.js" crossorigin="anonymous"></script>

    <title>Perfil - Empresa</title>
    <link rel="stylesheet" th:href="@{/styles/brand.css}" />
    <link rel="stylesheet" th:href="@{/styles/empresa/layout.css}" />
    <link rel="stylesheet" th:href="@{/styles/postulante/perfil_postulante.css}" />
    <link rel="stylesheet" th:href="@{/styles/empresa/perfil.css}" />
</head>

<body class="profile-page company-profile">
    <div th:replace="~{fragments/empresa/sidebar_empresa :: sidebar('perfil')}"></div>
    <div th:replace="~{fragments/empresa/header_empresa :: header}"></div>

    <main class="content">
        <p th:if="${success}" th:text="${success}" class="settings-notice" role="status"></p>
        <p th:if="${error}" th:text="${error}" class="settings-notice settings-notice--error" role="alert"></p>
      <section class="profile-hero" aria-label="Mi perfil">
        <div class="profile-hero__cover" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="profile-hero__body">
          <button type="button" class="profile-avatar-large" id="profileAvatarClickArea" aria-label="Cambiar foto de perfil">
            <img th:if="${not #strings.isEmpty(empresa.foto)}" th:src="${empresa.foto}" alt="" id="profileImage" />
            <span th:if="${#strings.isEmpty(empresa.foto)}" class="photo-placeholder"><i class="fa-solid fa-user" aria-hidden="true"></i></span>
            <span class="upload-overlay" aria-hidden="true"><i class="fa-solid fa-camera"></i></span>
          </button>
          <form th:action="@{/empresa/subirFoto(id=${empresa.id})}" method="post" enctype="multipart/form-data" id="fotoUploadForm" th:data-photo-url="@{/empresa/foto}" hidden><input type="file" name="file" accept="image/jpeg,image/png" id="fileInput" aria-label="Foto de perfil" /></form>
          <div class="profile-hero__identity"><h1 th:text="${empresa.nombreLegal}"></h1><p class="profile-hero__title" th:text="${#strings.isEmpty(empresa.sector) ? 'Empresa' : empresa.sector}"></p><p class="profile-hero__email" th:text="${empresa.email}"></p></div>
          <div class="profile-hero__actions"><button type="button" class="profile-delete-photo" data-photo-remove th:hidden="${#strings.isEmpty(empresa.foto)}">Quitar foto</button></div>
        </div>
      </section>
      <p class="profile-photo-feedback" data-photo-feedback role="status" aria-live="polite" hidden></p>
        <div class="profile profile-section">
            <div class="profile__container">
                <h3>Información de la empresa</h3>
                <div class="profile__field">
                    <form th:action="@{/empresa/guardar-perfil}" th:object="${empresa}" method="post"
                        enctype="multipart/form-data" id="empresaForm">
                        <div class="form">
                            <input type="hidden" name="foto" th:value="${empresa.foto}" />

                            <div class="form__field">
                                <label for="nombreLegal">Nombre</label>
                                <input type="text" th:field="*{nombreLegal}" id="nombreLegal"
                                    placeholder="Ej: Tech Solutions S.A.S" required>
                                <p class="error" th:if="${#fields.hasErrors('nombreLegal')}" th:errors="*{nombreLegal}">
                                </p>
                            </div>
                            <div class="form__field">
                                <label for="sector">Sector</label>
                                <input type="text" th:field="*{sector}" id="sector"
                                    placeholder="Ej: Tecnología, Marketing" required>
                                <p class="error" th:if="${#fields.hasErrors('sector')}" th:errors="*{sector}"></p>
                            </div>
                            <div class="form__field">
                                <label for="email">Correo de contacto</label>
                                <input type="email" th:field="*{email}" id="email" readonly>
                            </div>
                            <div class="form__field">
                                <label for="telefono">Teléfono</label>
                                <input type="text" th:field="*{telefono}" id="telefono" placeholder="Ej: 310 456 7890">
                                <p class="error" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></p>
                            </div>
                            <div class="form__field full-width">
                                <label for="rut">RUT / NIT</label>
                                <input type="text" th:field="*{rut}" id="rut" readonly>
                            </div>
                            <div class="form__field full-width">
                                <label for="ubicacion">Ubicación / Dirección</label>
                                <input type="text" th:field="*{ubicacion}" id="ubicacion"
                                    placeholder="Ej: Calle 45 #12-90, Bogotá" required>
                                <p class="error" th:if="${#fields.hasErrors('ubicacion')}" th:errors="*{ubicacion}"></p>
                            </div>
                            <div class="form__field full-width">
                                <label for="website">Sitio web</label>
                                <input type="text" th:field="*{website}" id="website"
                                    placeholder="Ej: https://www.miempresa.com">
                                <p class="error" th:if="${#fields.hasErrors('website')}" th:errors="*{website}"></p>
                            </div>
                            <div class="form__field full-width">
                                <label for="descripcion">Descripción de la empresa</label>
                                <textarea th:field="*{descripcion}" id="descripcion" rows="4"
                                    placeholder="Cuéntanos brevemente sobre tu empresa, misión y valores."></textarea>
                                <p class="error" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}">
                                </p>
                            </div>
                            <div class="form__actions">
                                <button type="submit" form="empresaForm" class="save">Guardar Cambios</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </main>

    <dialog class="profile-photo-dialog" aria-labelledby="photo-dialog-title">
      <h2 id="photo-dialog-title">Ajusta tu foto</h2>
      <p>Arrastra la imagen o usa las flechas para encuadrarla.</p>
      <canvas width="512" height="512" data-photo-canvas aria-label="Vista previa de la foto"></canvas>
      <label for="photoZoom">Zoom</label>
      <input id="photoZoom" type="range" min="1" max="3" step="0.01" value="1" />
      <p data-photo-editor-message role="status" aria-live="polite"></p>
      <div class="profile-photo-dialog__actions"><button type="button" data-photo-cancel>Cancelar</button><button type="button" class="profile-edit-button" data-photo-save>Guardar foto</button></div>
    </dialog>
    <script th:src="@{/js/perfil_foto.js}" defer></script>


</body>

</html>
