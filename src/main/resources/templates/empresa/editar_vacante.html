<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--Styles-->
    <link rel="stylesheet" th:href="@{/styles/empresa/editar_vacante.css}" />
    <link rel="stylesheet" th:href="@{/styles/fragments/empresa/sidebar.css}">
    <!--Fonts-->
    <link rel="stylesheet" th:href="@{/styles/satoshi.css}">
    <link rel="stylesheet" th:href="@{/styles/clash-display.css}">
    <!--Icons-->
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/source/img/hireconnect.png}">
    <script src="https://kit.fontawesome.com/e71256cba2.js" crossorigin="anonymous"></script>

    <title th:text="${vacante.id != null ? 'Editar Vacante: ' + vacante.titulo : 'Nueva Vacante'}"></title>
</head>

<body>
    <div th:replace="~{fragments/empresa/sidebar_empresa :: sidebar('vacantes')}"></div>

    <main class="main">
        <div class="main__header">
            <h2 class="main__header-title">
                <a th:href="@{/empresa/vacantes}">
                    <i class="fa-solid fa-arrow-left"></i> Volver
                </a>
            </h2>
        </div>

        <div class="form">
            <div class="form__card">
                <h2 class="form__title">
                    <span th:text="${vacante.id != null ? 'Editar Vacante' : 'Publicar Nueva Vacante'}"></span>
                    <i class="fa-solid fa-briefcase ml-2 text-primary"></i>
                </h2>

                <div th:if="${error}" class="alert alert-danger" role="alert">
                    <p th:text="${error}">Mensaje de Error</p>
                </div>
                <div th:if="${success}" class="alert alert-success" role="alert">
                    <p th:text="${success}">Mensaje de Éxito</p>
                </div>

                <form th:action="@{/empresa/vacantes/guardar}" th:object="${vacante}" method="post">
                    <input type="hidden" id="id" name="id" th:value="${vacante.id}" />
                    <input type="hidden" id="fechaPublicacion" name="fechaPublicacion"
                        th:value="${vacante.fechaPublicacion}" />
                    <div class="form__fields-group">
                        <div class="form__field">
                            <label for="titulo" class="form__label">Título de la
                                Vacante</label>
                            <input type="text" th:field="*{titulo}" id="titulo" class="form__input"
                                placeholder="Ej: Desarrollador Backend Senior" required />
                            <p th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}" class="field-error"></p>
                        </div>

                        <div class="form__field">
                            <label for="descripcion" class="form__label">Descripción
                                Detallada</label>
                            <textarea th:field="*{descripcion}" id="descripcion" rows="5" class="form__input"
                                placeholder="Describe las responsabilidades y requisitos..." required></textarea>
                            <p th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"
                                class="field-error">
                            </p>
                        </div>

                        <div class="form__field">
                            <label for="habilidadesRequeridas" class="form__label">Habilidades Requeridas (Opcional,
                                separadas por coma)</label>
                            <textarea th:field="*{habilidadesRequeridas}" id="habilidadesRequeridas" rows="3"
                                class="form__input"
                                placeholder="Ej: Java, Spring Boot, REST APIs, Inglés fluido..."></textarea>
                            <p th:if="${#fields.hasErrors('habilidadesRequeridas')}"
                                th:errors="*{habilidadesRequeridas}" class="field-error"></p>
                        </div>

                        <div class="form__group-2">
                            <div class="form__field">
                                <label for="salario" class="form__label">Salario</label>
                                <input type="number" th:field="*{salario}" id="salario" class="form__input"
                                    placeholder="Ej: 3.500.000" step="1" required />
                                <p th:if="${#fields.hasErrors('salario')}" th:errors="*{salario}" class="field-error">
                                </p>
                            </div>

                            <div class="form__field">
                                <label for="tipoContrato" class="form__label">Tipo de
                                    Contrato</label>
                                <select th:field="*{tipoContrato}" id="tipoContrato" class="form__select" required>
                                    <option value="">Seleccione un Tipo de Contrato</option>
                                    <option th:each="tipo : ${tiposContrato}" th:value="${tipo}" th:text="${tipo.descripcion}">
                                    </option>
                                </select>
                                <p th:if="${#fields.hasErrors('tipoContrato')}" th:errors="*{tipoContrato}"
                                    class="field-error"></p>
                            </div>

                            <div class="form__field">
                                <label for="modalidad" class="form__label">Modalidad de
                                    Trabajo</label>
                                <select th:field="*{modalidad}" id="modalidad" class="form__select" required>
                                    <option value="">Seleccione una Modalidad</option>
                                    <option th:each="m : ${modalidades}" th:value="${m}" th:text="${m.descripcion}"></option>
                                </select>
                                <p th:if="${#fields.hasErrors('modalidad')}" th:errors="*{modalidad}"
                                    class="field-error">
                                </p>
                            </div>

                            <div class="form__field">
                                <label for="experienciaRequerida" class="form__label">Nivel
                                    de Experiencia</label>
                                <select th:field="*{experienciaRequerida}" id="experienciaRequerida" class="form__select"
                                    required>
                                    <option value="">Selecciona un nivel</option>
                                    <option th:each="e : ${nivelesExperiencia}" th:value="${e}"
                                        th:text="${e.descripcion}"></option>
                                </select>
                                <p th:if="${#fields.hasErrors('experienciaRequerida')}"
                                    th:errors="*{experienciaRequerida}" class="field-error"></p>
                            </div>

                            <div class="form__field">
                                <label for="fechaInicio" class="form__label">Fecha de Inicio</label> 
                                <input class="form__input"  type="date" th:field="*{fechaInicio}" id="fechaInicio" placeholder="dd/mm/aaaa" required />
                            </div>
                            <div class="form__field">
                                <label class="form__label" for="fechaFin">Fecha de Cierre</label> 
                                <input class="form__input" type="date" th:field="*{fechaFin}"
                                    id="fechaFin" placeholder="dd/mm/aaaa" required />
                            </div>
                        </div>
                    </div>

                    <div class="form__actions">
                        <a th:href="@{/empresa/vacantes}" class="btn btn-secondary">
                            <i class="fa-solid fa-ban mr-2"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i th:class="${vacante.id != null ? 'fa-solid fa-save' : 'fa-solid fa-paper-plane'}"
                                class="mr-2"></i>
                            <span th:text="${vacante.id != null ? 'Guardar Cambios' : 'Publicar Vacante'}"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
