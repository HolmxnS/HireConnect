<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--Tema: aplica el tema guardado (o el del sistema) antes de pintar para evitar parpadeo-->
    <script>
        (function () {
            var theme = 'light';
            try {
                var saved = localStorage.getItem('hc-theme');
                theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            } catch (e) { }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <!--Styles-->
    <link rel="stylesheet" th:href="@{/styles/empresa/registro_empresa.css}" />
    <!--Fonts-->
    <link rel="stylesheet" th:href="@{/styles/satoshi.css}" />
    <link rel="stylesheet" th:href="@{/styles/clash-display.css}" />
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/source/img/hireconnect.png}">
    <!--Icons (font awesome kit)-->
    <script src="https://kit.fontawesome.com/e71256cba2.js" crossorigin="anonymous"></script>
    <title>Registro - Empresa</title>
</head>

<body>
    <main class="signup">

        <!--Columna del formulario-->
        <section class="signup__panel">

            <header class="signup__top">
                <a class="signup__logo" th:href="@{/}" aria-label="Ir al inicio">
                    <i class="fa-solid fa-bolt" aria-hidden="true"></i>
                </a>
            </header>

            <div class="signup__content">

                <!--Barra de pasos (el paso actual lo marca data-step; registro_postulante.js lo actualiza)-->
                <ol class="stepper" id="stepper" aria-label="Progreso del registro"
                    th:attr="data-step=${mostrarPaso2} ? 2 : 1" data-step="1">
                    <li class="stepper__step">
                        <span class="stepper__circle">1</span>
                        <span class="stepper__label">Datos de la empresa</span>
                    </li>
                    <li class="stepper__step">
                        <span class="stepper__circle">2</span>
                        <span class="stepper__label">Cuenta</span>
                    </li>
                    <li class="stepper__step">
                        <span class="stepper__circle">3</span>
                        <span class="stepper__label">Verificación</span>
                    </li>
                </ol>

                <div class="signup__intro">
                    <h1 class="signup__title">Registro</h1>
                    <p class="signup__subtitle">Completa los datos de tu empresa para comenzar a publicar vacantes</p>
                </div>

                <form id="register-form" class="form" th:action="@{/empresa/crear}" th:object="${empresa}"
                    method="post" novalidate>

                    <input type="hidden" id="currentStep" name="step" value="1" />

                    <!--Avisos: errores del servidor (por ejemplo, no se pudo enviar el codigo) y errores de campos del paso 1 que no se ven en el paso 2-->
                    <div class="form__alert" role="alert" th:if="${error}">
                        <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
                        <p th:text="${error}">Error</p>
                    </div>
                    <div class="form__alert" role="alert" th:if="${mostrarPaso2} and ${#fields.hasErrors('*')}">
                        <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
                        <ul class="form__alert-list">
                            <li th:each="mensaje : ${#fields.errors('*')}" th:text="${mensaje}">Error</li>
                        </ul>
                    </div>

                    <!--Paso 1: informacion legal-->
                    <div id="step-1" class="form__step">

                        <h2 class="form__section">
                            <span class="form__section-icon" aria-hidden="true"><i
                                    class="fa-solid fa-building"></i></span>
                            Información legal
                        </h2>

                        <div class="form__row">
                            <div class="form__field">
                                <label class="form__label" for="nombreLegal">Nombre legal de la empresa</label>
                                <input class="form__control" type="text" id="nombreLegal" th:field="*{nombreLegal}"
                                    placeholder="Ej: TechSolutions S.A.S." required />
                                <p class="form__error" th:if="${#fields.hasErrors('nombreLegal')}"
                                    th:text="${#fields.errors('nombreLegal')[0]}"></p>
                            </div>
                            <div class="form__field">
                                <label class="form__label" for="rut">RUT / NIT (Identificador Fiscal)</label>
                                <input class="form__control" type="text" id="rut" th:field="*{rut}"
                                    placeholder="Ej: 900.123.456-1" required />
                                <p class="form__error" th:if="${#fields.hasErrors('rut')}"
                                    th:text="${#fields.errors('rut')[0]}"></p>
                            </div>
                        </div>

                        <div class="form__row">
                            <div class="form__field">
                                <label class="form__label" for="sector">Sector / Industria</label>
                                <input class="form__control" type="text" id="sector" th:field="*{sector}"
                                    placeholder="Ej: Tecnología, Finanzas..." />
                                <p class="form__error" th:if="${#fields.hasErrors('sector')}"
                                    th:text="${#fields.errors('sector')[0]}"></p>
                            </div>
                            <div class="form__field">
                                <label class="form__label" for="ubicacion">Ubicación principal</label>
                                <input class="form__control" type="text" id="ubicacion" th:field="*{ubicacion}"
                                    placeholder="Ej: Bogotá, Colombia" />
                                <p class="form__error" th:if="${#fields.hasErrors('ubicacion')}"
                                    th:text="${#fields.errors('ubicacion')[0]}"></p>
                            </div>
                        </div>

                        <button type="submit" class="form__submit">
                            Continuar <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                        </button>
                    </div>

                    <!--Paso 2: contacto y cuenta-->
                    <div id="step-2" class="form__step" hidden>

                        <h2 class="form__section">
                            <span class="form__section-icon" aria-hidden="true"><i
                                    class="fa-solid fa-envelope"></i></span>
                            Contacto
                        </h2>

                        <div class="form__row">
                            <div class="form__field">
                                <label class="form__label" for="email">Email de la empresa</label>
                                <input class="form__control" type="email" id="email" th:field="*{email}"
                                    placeholder="Ej: contacto@techsolutions.com" required />
                                <p class="form__error" th:if="${#fields.hasErrors('email')}"
                                    th:text="${#fields.errors('email')[0]}"></p>
                            </div>
                            <div class="form__field">
                                <label class="form__label" for="telefono">Teléfono de contacto</label>
                                <input class="form__control" type="tel" id="telefono" th:field="*{telefono}"
                                    placeholder="Ej: 300 1234567" />
                                <p class="form__error" th:if="${#fields.hasErrors('telefono')}"
                                    th:text="${#fields.errors('telefono')[0]}"></p>
                            </div>
                        </div>

                        <div class="form__row">
                            <div class="form__field">
                                <label class="form__label" for="password">Contraseña</label>
                                <div class="form__password">
                                    <input class="form__control" type="password" id="password" th:field="*{password}"
                                        placeholder="Crea una contraseña segura" required />
                                    <button type="button" class="form__toggle" data-toggle-password="password"
                                        aria-label="Mostrar contraseña" aria-pressed="false">
                                        <span class="form__toggle-icon form__toggle-icon--show"><i
                                                class="fa-regular fa-eye"></i></span>
                                        <span class="form__toggle-icon form__toggle-icon--hide"><i
                                                class="fa-regular fa-eye-slash"></i></span>
                                    </button>
                                </div>
                                <p class="form__error" th:if="${#fields.hasErrors('password')}"
                                    th:text="${#fields.errors('password')[0]}"></p>
                            </div>
                            <div class="form__field">
                                <label class="form__label" for="confirmPassword">Confirmar contraseña</label>
                                <div class="form__password">
                                    <input class="form__control" type="password" id="confirmPassword" th:field="*{confirmPassword}"
                                        placeholder="Repite tu contraseña" required />
                                    <button type="button" class="form__toggle" data-toggle-password="confirmPassword"
                                        aria-label="Mostrar contraseña" aria-pressed="false">
                                        <span class="form__toggle-icon form__toggle-icon--show"><i
                                                class="fa-regular fa-eye"></i></span>
                                        <span class="form__toggle-icon form__toggle-icon--hide"><i
                                                class="fa-regular fa-eye-slash"></i></span>
                                    </button>
                                </div>
                                <p class="form__error" th:if="${#fields.hasErrors('confirmPassword')}"
                                    th:text="${#fields.errors('confirmPassword')[0]}"></p>
                                <p class="form__error" data-match-error aria-live="polite"></p>
                            </div>
                        </div>

                        <button type="submit" class="form__submit">
                            Crear cuenta <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                        </button>
                    </div>

                </form>

                <p class="signup__footer">
                    ¿Ya tienes una cuenta?
                    <a class="signup__footer-link" th:href="@{/login}">Inicia sesión</a>
                </p>
            </div>
        </section>

        <!--Columna de la imagen (decorativa)-->
        <aside class="signup__art">
            <img class="signup__art-img" th:src="@{/source/img/login-art.png}" alt="">
        </aside>
    </main>

    <script th:inline="javascript">
        window.mostrarPaso2 = /*[[${mostrarPaso2}]]*/ false;
    </script>

    <script th:src="@{/js/registro_empresa.js}"></script>
</body>

</html>
