<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/styles/fragments/admin/sidebar.css}">
    <link rel="stylesheet" th:href="@{/styles/admin/gestion_empresas.css}">
    <link rel="stylesheet" th:href="@{/styles/admin/theme.css}">
    <script th:src="@{/js/theme.js}"></script>
    <link rel="stylesheet" th:href="@{/styles/satoshi.css}">
    <link rel="stylesheet" th:href="@{/styles/clash-display.css}">
    <script src="https://kit.fontawesome.com/e71256cba2.js" crossorigin="anonymous"></script>
    <link rel="icon" type="image/svg+xml" sizes="any" th:href="@{/source/img/favicon.svg}">

    <title>Revisar Empresas</title>
    <link rel="stylesheet" th:href="@{/styles/brand.css}" />
</head>

<body>
    <div th:replace="~{fragments/admin/sidebar_admin :: sidebar('empresas')}"></div>

    <main class="main">

        <div th:replace="~{fragments/admin/header_admin :: topbar('Empresas en la plataforma', 'Listado y gestión de perfiles de empresas y sus vacantes.')}"></div>

        <section class="kpis" aria-label="Resumen de empresas">
            <div class="kpi">
                <span class="kpi__icon"><i class="fa-solid fa-building"></i></span>
                <div class="kpi__body">
                    <span class="kpi__number" th:text="${totalEmpresas}">0</span>
                    <span class="kpi__label">Número de empresas</span>
                </div>
            </div>
            <div class="kpi">
                <span class="kpi__icon kpi__icon--ok"><i class="fa-solid fa-circle-check"></i></span>
                <div class="kpi__body">
                    <span class="kpi__number" th:text="${empresasActivas}">0</span>
                    <span class="kpi__label">Empresas activas</span>
                </div>
            </div>
            <div class="kpi">
                <span class="kpi__icon kpi__icon--bad"><i class="fa-solid fa-ban"></i></span>
                <div class="kpi__body">
                    <span class="kpi__number" th:text="${empresasDeshabilitadas}">0</span>
                    <span class="kpi__label">Empresas deshabilitadas</span>
                </div>
            </div>
            <div class="kpi">
                <span class="kpi__icon kpi__icon--info"><i class="fa-solid fa-briefcase"></i></span>
                <div class="kpi__body">
                    <span class="kpi__number" th:text="${vacantes}">0</span>
                    <span class="kpi__label">Vacantes publicadas</span>
                </div>
            </div>
        </section>

        <section class="toolbar">
            <div class="search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInputEmpresas" onkeyup="filterEmpresas()"
                    placeholder="Buscar por nombre de empresa...">
            </div>
            <select id="sortFilterEmpresas" class="select">
                <option value="most_recent">Más reciente</option>
                <option value="oldest">Más antiguo</option>
            </select>
        </section>

        <section class="panel table-panel">
            <div class="table-scroll">
                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col">Nombre legal</th>
                            <th scope="col">Fecha de registro</th>
                            <th scope="col">RUC / Identificación</th>
                            <th scope="col">Email de contacto</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="empresasList">
                        <tr th:each="empresa : ${empresas}" class="empresa-item"
                            th:attr="data-date=${#temporals.format(empresa.fechaRegistro, 'yyyy-MM-dd')}">
                            <td th:text="${empresa.nombreLegal}" class="table__strong empresa-nombre"></td>
                            <td th:text="${#temporals.format(empresa.fechaRegistro, 'dd MMM yyyy')}" class="table__muted"></td>
                            <td th:text="${empresa.rut}" class="table__muted"></td>
                            <td th:text="${empresa.email}" class="table__muted"></td>
                            <td>
                                <div class="table__actions">
                                    <a th:href="@{/admin/empresas/ver/{id}(id=${empresa.id})}" class="btn btn--soft btn--sm">
                                        <i class="fa-solid fa-eye"></i> Ver perfil
                                    </a>
                                    <a th:href="@{/admin/empresas/deshabilitar/{id}(id=${empresa.id})}"
                                        onclick="return confirm('¿Quieres eliminar esta empresa? Esta accion no se puede deshacer. ')"
                                        class="btn btn--danger btn--sm">
                                        <i class="fa-solid fa-trash"></i> Eliminar
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(empresas)}">
                            <td colspan="5" class="table__empty">No hay empresas registradas para revisión.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script th:src="@{/js/gestion_empresas.js}" defer></script>
    <script th:src="@{/js/admin_dashboard.js}"></script>
</body>

</html>
