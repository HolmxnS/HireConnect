<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Styles-->
    <link rel="stylesheet" th:href="@{/styles/fragments/admin/sidebar.css}">
    <link rel="stylesheet" th:href="@{/styles/admin/gestion_postulantes.css}">
    <link rel="stylesheet" th:href="@{/styles/admin/theme.css}">
    <script th:src="@{/js/theme.js}"></script>
    <!--Fonts-->
    <link rel="stylesheet" th:href="@{/styles/satoshi.css}">
    <link rel="stylesheet" th:href="@{/styles/clash-display.css}">
    <!--Icons-->
    <script src="https://kit.fontawesome.com/e71256cba2.js" crossorigin="anonymous"></script>
    <link rel="icon" type="image/svg+xml" sizes="any" th:href="@{/source/img/favicon.svg}">

    <title>Revisar Postulantes</title>
    <link rel="stylesheet" th:href="@{/styles/brand.css}" />
</head>

<body>
    <div th:replace="~{fragments/admin/sidebar_admin :: sidebar('postulantes')}"></div>

    <main class="main">

        <div th:replace="~{fragments/admin/header_admin :: topbar('Candidatos registrados', 'Listado y gestión de perfiles de candidatos y sus habilidades.')}"></div>

        <section class="kpis" aria-label="Resumen de postulantes">
            <div class="kpi">
                <span class="kpi__icon"><i class="fa-solid fa-users"></i></span>
                <div class="kpi__body">
                    <span class="kpi__number" th:text="${totalPostulantes}">0</span>
                    <span class="kpi__label">Total postulantes</span>
                </div>
            </div>
            <div class="kpi">
                <span class="kpi__icon kpi__icon--info"><i class="fa-solid fa-hourglass-half"></i></span>
                <div class="kpi__body">
                    <span class="kpi__number" th:text="${postulantesRevision}">0</span>
                    <span class="kpi__label">En revisión</span>
                </div>
            </div>
            <div class="kpi">
                <span class="kpi__icon kpi__icon--ok"><i class="fa-solid fa-circle-check"></i></span>
                <div class="kpi__body">
                    <span class="kpi__number" th:text="${postulantesAceptados}">0</span>
                    <span class="kpi__label">Aceptados</span>
                </div>
            </div>
            <div class="kpi">
                <span class="kpi__icon"><i class="fa-solid fa-id-card"></i></span>
                <div class="kpi__body">
                    <span class="kpi__number" th:text="${postulantesCompletados}">0</span>
                    <span class="kpi__label">Perfiles completos</span>
                </div>
            </div>
            <div class="kpi">
                <span class="kpi__icon kpi__icon--info"><i class="fa-solid fa-paper-plane"></i></span>
                <div class="kpi__body">
                    <span class="kpi__number" th:text="${totalPostulaciones}">0</span>
                    <span class="kpi__label">Postulaciones</span>
                </div>
            </div>
        </section>

        <section class="toolbar">
            <div class="search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInputPostulantes" placeholder="Buscar por nombre o apellido..."
                    onkeyup="filterPostulantes()">
            </div>

            <select id="statusFilter" class="select" onchange="filterPostulantes()">
                <option value="all">Todos los estados</option>
                <option value="En revision">En revisión</option>
                <option value="Aceptada">Aceptada</option>
                <option value="Rechazada">Rechazada</option>
            </select>

            <select id="cvFilter" class="select" onchange="filterPostulantes()">
                <option value="all">Todos los CV</option>
                <option value="complete">CV completo</option>
                <option value="incomplete">Sin CV</option>
            </select>

            <select id="sortFilterPostulantes" class="select">
                <option value="most_recent">Más recientes</option>
                <option value="oldest">Más antiguos</option>
            </select>
        </section>

        <section class="panel table-panel">
            <div class="table-scroll">
                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col">Nombre</th>
                            <th scope="col">Apellido</th>
                            <th scope="col">CV</th>
                            <th scope="col">Estado</th>
                            <th scope="col">Fecha de registro</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="postulantesList">
                        <tr th:each="postulante : ${postulantes}" class="postulante-item"
                            th:attr="data-date=${#temporals.format(postulante.fechaRegistro,'yyyy-MM-dd')}">
                            <td class="nombre table__strong" th:text="${postulante.nombre}">Nombre</td>
                            <td class="apellido table__strong" th:text="${postulante.apellido}">Apellido</td>
                            <!-- Importante: el texto de estas celdas lo lee el filtro JS, no agregar espacios ni etiquetas dentro -->
                            <td class="cv" th:classappend="${postulante.cv != null} ? 'cv--ok' : 'cv--no'"
                                th:text="${postulante.cv != null ? 'Completo' : 'Incompleto'}">CV</td>
                            <td class="postulacion-estado"
                                th:classappend="${estados[postulante.id] == 'Aceptada'} ? 'estado--ok' : (${estados[postulante.id] == 'Rechazada'} ? 'estado--bad' : 'estado--warn')"
                                th:text="${estados[postulante.id]}">Estado</td>
                            <td class="table__muted" th:text="${#temporals.format(postulante.fechaRegistro,'dd/MM/yyyy')}">Fecha</td>
                            <td>
                                <a th:href="@{'/postulante/descargarCV/' + ${postulante.id}}" target="_blank"
                                    class="btn btn--soft btn--sm">
                                    <i class="fa-solid fa-file-lines"></i> Ver CV
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(postulantes)}">
                            <td colspan="6" class="table__empty">No hay postulantes registrados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script th:src="@{/js/gestion_postulantes.js}"></script>
    <script th:src="@{/js/admin_dashboard.js}"></script>
</body>

</html>
