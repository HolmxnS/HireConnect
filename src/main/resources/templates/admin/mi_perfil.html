<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Styles-->
    <link rel="stylesheet" th:href="@{/styles/fragments/admin/sidebar.css}">
    <link rel="stylesheet" th:href="@{/styles/admin/mi_perfil.css}">
    <link rel="stylesheet" th:href="@{/styles/admin/theme.css}">
    <script th:src="@{/js/theme.js}"></script>
    <!--Fonts-->
    <link rel="stylesheet" th:href="@{/styles/satoshi.css}">
    <link rel="stylesheet" th:href="@{/styles/clash-display.css}">
    <!--Icons-->
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/source/img/hireconnect.png}">
    <script src="https://kit.fontawesome.com/e71256cba2.js" crossorigin="anonymous"></script>
    <title>HireConnect - Editar Perfil Admin</title>
</head>

<body>
    <div th:replace="~{fragments/admin/sidebar_admin :: sidebar('perfil')}"></div>

    <main class="main">

        <header class="page-head">
            <div>
                <h1 class="page-head__title">Mi perfil</h1>
                <p class="page-head__subtitle">Actualiza tu foto y tus datos de administrador.</p>
            </div>
        </header>

        <section class="profile-banner">
            <div class="profile-banner__bg"></div>

            <div class="profile-banner__content">
                <div class="profile-avatar" id="profileAvatarClickArea" title="Cambiar foto">
                    <img th:if="${admin.foto != null and admin.foto != ''}" th:src="@{${admin.foto}}"
                        alt="Foto de perfil" id="profileImage">
                    <div th:if="${admin.foto == null or admin.foto == ''}" class="profile-avatar__placeholder">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="profile-avatar__overlay"><i class="fa-solid fa-camera"></i></div>
                </div>

                <form th:action="@{/admin/subirFoto(id=${admin.id})}" method="post" enctype="multipart/form-data"
                    id="fotoUploadForm" class="visually-hidden">
                    <input type="file" name="file" accept="image/*" id="fileInput">
                </form>

                <div class="profile-details">
                    <h2 th:text="${admin.nombre + ' ' + admin.apellido}">Nombre</h2>
                    <p th:text="${admin.email}">Correo del administrador</p>
                </div>

                <div class="profile-photo-actions">
                    <a th:if="${admin.foto != null and admin.foto != ''}"
                        th:href="@{/admin/eliminarFoto(id=${admin.id})}" class="btn btn--danger btn--sm">
                        <i class="fa-solid fa-trash"></i> Eliminar foto
                    </a>
                </div>
            </div>
        </section>

        <section class="panel profile-card">
            <h3>Información básica y seguridad</h3>

            <form th:action="@{/admin/guardar-perfil}" th:object="${admin}" method="post" id="adminForm" class="form">
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{email}" />
                <input type="hidden" th:field="*{password}" />

                <div class="form__field">
                    <label for="nombre">Nombre</label>
                    <input type="text" th:field="*{nombre}" id="nombre" placeholder="Nombre" required>
                </div>

                <div class="form__field">
                    <label for="apellido">Apellido</label>
                    <input type="text" th:field="*{apellido}" id="apellido" placeholder="Apellido" required>
                </div>

                <div class="form__field form__field--full">
                    <label for="emailView">Email</label>
                    <input type="email" id="emailView" th:value="${admin.email}" disabled>
                </div>

                <div class="form__actions">
                    <button type="submit" class="btn btn--primary">
                        <i class="fa-solid fa-floppy-disk"></i> Guardar cambios
                    </button>
                </div>
            </form>
        </section>
    </main>

    <script th:src="@{/js/foto.js}"></script>
</body>

</html>
