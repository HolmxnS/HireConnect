<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/styles/fragments/admin/sidebar.css}">
    <link rel="stylesheet" th:href="@{/styles/admin/ver_vacante.css}">
    <link rel="stylesheet" th:href="@{/styles/admin/theme.css}">
    <script th:src="@{/js/theme.js}"></script>
    <link rel="stylesheet" th:href="@{/styles/satoshi.css}">
    <link rel="stylesheet" th:href="@{/styles/clash-display.css}">
    <link rel="icon" type="image/svg+xml" sizes="any" th:href="@{/source/img/favicon.svg}">
    <script src="https://kit.fontawesome.com/e71256cba2.js" crossorigin="anonymous"></script>
    <title th:text="'Detalle de Vacante - ' + ${vacante.titulo}"></title>
    <link rel="stylesheet" th:href="@{/styles/brand.css}" />
</head>

<body>
    <div th:replace="~{fragments/admin/sidebar_admin :: sidebar('empresas')}"></div>

    <main class="main">

        <div>
            <a th:href="@{/admin/empresas/ver/{id}(id=${vacante.empresa.id})}" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i> Volver
            </a>
        </div>

        <section class="panel">
            <div class="detail-top" style="margin-bottom: 0; padding-bottom: 0; border-bottom: none;">
                <div class="detail-top__heading">
                    <h2 th:text="${vacante.titulo}">Título de la vacante</h2>
                    <p>Publicada por: <strong th:text="${vacante.empresa.nombreLegal}">Empresa</strong></p>
                </div>

                <div class="detail-top__actions">
                    <span class="badge"
                        th:classappend="${vacante.estado.name() == 'ACTIVA'} ? 'badge--ok' : (${vacante.estado.name() == 'CERRADA'} ? 'badge--bad' : 'badge--warn')"
                        th:text="${vacante.estado}">ACTIVA</span>
                    <a th:href="@{/admin/vacantes/cerrar/{id}(id=${vacante.id})}"
                        onclick="return confirm('¿Estás seguro de CERRAR esta vacante?')" class="btn btn--danger">
                        <i class="fa-solid fa-circle-xmark"></i> Cerrar
                    </a>
                </div>
            </div>
        </section>

        <section class="panel">
            <div class="detail-grid">
                <div>
                    <h3>Información</h3>
                    <ul class="info-list">
                        <li><i class="fa-solid fa-money-bill"></i> Salario: $<span
                                th:text="${#numbers.formatDecimal(vacante.salario, 0, 'COMMA', 0, 'POINT')}"></span></li>
                        <li><i class="fa-solid fa-clock"></i> Tipo: <span th:text="${vacante.tipoContrato.descripcion}"></span></li>
                        <li><i class="fa-solid fa-map-pin"></i> Modalidad: <span th:text="${vacante.modalidad.descripcion}"></span></li>
                        <li><i class="fa-solid fa-graduation-cap"></i> Nivel: <span th:text="${vacante.experienciaRequerida.descripcion}"></span></li>
                        <li><i class="fa-solid fa-calendar-check"></i> Publicación:
                            <span th:text="${#temporals.format(vacante.fechaPublicacion, 'dd/MMM/yyyy')}"></span></li>
                        <li><i class="fa-solid fa-list-ol"></i> Total postulantes:
                            <span th:text="${#lists.size(postulantes)}"></span></li>
                    </ul>
                </div>

                <div>
                    <h3>Descripción detallada</h3>
                    <div class="text-box rich-text" th:utext="${vacante.descripcion}"></div>
                </div>
            </div>
        </section>

        <section class="panel table-panel">
            <div class="panel__head" style="padding: 2.4rem 2.4rem 0;">
                <h2 class="panel__title"><i class="fa-solid fa-users-line"></i> Postulaciones</h2>
            </div>

            <div class="table-scroll">
                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col">Nombre del postulante</th>
                            <th scope="col">Email</th>
                            <th scope="col">Fecha de postulación</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="postulacion : ${postulantes}">
                            <td class="table__strong"
                                th:text="${postulacion.postulante.nombre} + ' ' + ${postulacion.postulante.apellido}"></td>
                            <td class="table__muted" th:text="${postulacion.postulante.email}"></td>
                            <td class="table__muted" th:text="${#temporals.format(postulacion.fechaPostulacion, 'dd/MM/yyyy')}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(postulantes)}">
                            <td colspan="3" class="table__empty">Aún no hay postulaciones.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>

</html>
