<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/styles/fragments/admin/sidebar.css}">
    <link rel="stylesheet" th:href="@{/styles/admin/theme.css}">
    <script th:src="@{/js/theme.js}"></script>
    <link rel="stylesheet" th:href="@{/styles/satoshi.css}">
    <link rel="stylesheet" th:href="@{/styles/clash-display.css}">
    <script src="https://kit.fontawesome.com/e71256cba2.js" crossorigin="anonymous"></script>
    <link rel="icon" type="image/svg+xml" sizes="any" th:href="@{/source/img/favicon.svg}">

    <title>Vacantes | HireConnect</title>
    <link rel="stylesheet" th:href="@{/styles/brand.css}" />
    <link rel="stylesheet" th:href="@{/styles/admin/workspace.css}" />
    <link rel="stylesheet" th:href="@{/styles/toasts.css}" />
    <link rel="stylesheet" th:href="@{/styles/admin/content.css}" />
</head>

<body class="admin-area admin-layout-page">
<div th:replace="~{fragments/admin/sidebar_admin :: sidebar('vacantes')}"></div>
<div th:replace="~{fragments/admin/header_admin :: topbar('Administración', '')}"></div>
<main class="main"><div class="vacancy-management">
<div class="admin-page-heading"><h1>Vacantes</h1><p>Supervisa las publicaciones de la plataforma.</p></div>
<form class="toolbar company-search-form" id="vacancySearchForm" th:action="@{/admin/vacantes}" method="get"><div class="search"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><input type="search" id="searchInputAdminVacantes" name="q" th:value="${q}" maxlength="120" data-admin-job-search placeholder="Buscar por vacante o empresa…" aria-label="Buscar por vacante o empresa"/></div><select name="estado" data-admin-job-state aria-label="Estado"><option value="">Todos los estados</option><option value="ACTIVA" th:selected="${estadoFiltro == 'ACTIVA'}">Activas</option><option value="PENDIENTE" th:selected="${estadoFiltro == 'PENDIENTE'}">Pendientes</option><option value="CERRADA" th:selected="${estadoFiltro == 'CERRADA'}">Cerradas</option></select><select name="orden" aria-label="Ordenar por fecha"><option value="most_recent">Más recientes</option><option value="oldest" th:selected="${ordenFiltro == 'oldest'}">Más antiguas</option></select><button type="submit" class="company-search-submit">Buscar</button></form>
<p class="company-request-status" data-vacancy-request-status role="status" aria-live="polite"></p>
<div th:fragment="resultados" data-vacancy-results>
<p class="admin-list-count" aria-live="polite" th:text="${paginaVacantes.totalElements == 0 ? 'No se encontraron vacantes.' : 'Mostrando ' + (paginaVacantes.number * paginaVacantes.size + 1) + '–' + (paginaVacantes.number * paginaVacantes.size + paginaVacantes.numberOfElements) + ' de ' + paginaVacantes.totalElements + ' vacantes'}"></p>
<section class="panel table-panel"><div class="table-scroll company-table-scroll" role="region" tabindex="0" aria-label="Listado de vacantes"><table class="table"><thead><tr><th scope="col">Vacante</th><th scope="col">Empresa</th><th scope="col">Publicación</th><th scope="col">Estado</th><th scope="col">Acciones</th></tr></thead><tbody><tr th:each="v : ${vacantes}" data-admin-job th:data-state="${v.estado?.name()}"><td th:text="${v.titulo}"></td><td th:text="${v.empresa?.nombre ?: 'Sin empresa'}"></td><td th:text="${v.fechaPublicacion != null ? #temporals.format(v.fechaPublicacion,'dd MMM yyyy') : 'Sin fecha'}"></td><td th:text="${v.estado ?: 'Sin estado'}"></td><td><a class="btn btn--soft btn--sm" th:href="@{/admin/vacantes/ver/{id}(id=${v.id})}">Ver detalle ↗</a></td></tr><tr th:if="${#lists.isEmpty(vacantes)}"><td colspan="5" class="table__empty">No hay vacantes que coincidan con la búsqueda.</td></tr></tbody></table></div></section>
<nav class="company-pagination" aria-label="Páginas de vacantes"><a th:if="${paginaVacantes.hasPrevious()}" th:href="@{/admin/vacantes(q=${q},estado=${estadoFiltro},orden=${ordenFiltro},pagina=${paginaVacantes.number - 1})}" data-vacancy-page>← Anterior</a><span th:unless="${paginaVacantes.hasPrevious()}" aria-disabled="true">← Anterior</span><span th:text="${'Página ' + (paginaVacantes.totalPages == 0 ? 1 : paginaVacantes.number + 1) + ' de ' + (paginaVacantes.totalPages == 0 ? 1 : paginaVacantes.totalPages)}"></span><a th:if="${paginaVacantes.hasNext()}" th:href="@{/admin/vacantes(q=${q},estado=${estadoFiltro},orden=${ordenFiltro},pagina=${paginaVacantes.number + 1})}" data-vacancy-page>Siguiente →</a><span th:unless="${paginaVacantes.hasNext()}" aria-disabled="true">Siguiente →</span></nav>
</div></div></main><script th:src="@{/js/admin_vacantes.js}" defer></script>
</body></html>
