# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Java + Python to HireConnect-expo

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout
      id-token: write # Azure OIDC login in the same job avoids artifact storage.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Set up portable Python tooling
        uses: astral-sh/setup-uv@v6

      - name: Build and test Java
        run: mvn -B clean package

      - name: Install a relocatable Python runtime and model dependencies
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/hireconnect-python
          UV_PYTHON_BIN_DIR: ${{ runner.temp }}/hireconnect-python-bin
        run: |
          uv python install 3.12
          PYTHON_EXE="$(uv python find --managed-python 3.12)"
          uv pip install --python "$PYTHON_EXE" --system --break-system-packages --link-mode copy --python-platform x86_64-manylinux_2_28 --only-binary :all: -r ml/requirements.lock.txt
          "$PYTHON_EXE" -m unittest discover -s ml -p 'test_*.py' -v
          "$PYTHON_EXE" -m unittest discover -s deploy -p 'test_*.py' -v
          RUNTIME_DIR="$(dirname "$(dirname "$PYTHON_EXE")")"
          "$PYTHON_EXE" deploy/package_azure.py --runtime "$RUNTIME_DIR"
          SMOKE_ROOT="${{ runner.temp }}/hireconnect-relocated"
          mkdir -p "$SMOKE_ROOT"
          unzip -q target/azure-package.zip -d "$SMOKE_ROOT"
          chmod +x "$SMOKE_ROOT/.python/bin/"*
          cd "$SMOKE_ROOT"
          .python/bin/python3 -c "import ssl, flask, sklearn, scipy, numpy, pymongo; print('Runtime reubicado listo')"
          .python/bin/python3 -m unittest discover -s ml -p 'test_*.py' -v

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_182D91575EE9478282D96C7034346B57 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_781A66D1AE25494CBCB99C97E382758E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E6EABAE6C42043D8BA072E6D820E60F8 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'HireConnect-expo'
          slot-name: 'Production'
          package: target/azure-package.zip
          type: ZIP
          startup-command: 'bash /home/site/wwwroot/deploy/azure-start.sh'

      - name: Verify Java and Python are ready in Azure
        run: |
          for attempt in $(seq 1 36); do
            if curl --silent --show-error --fail --max-time 8 \
              'https://hireconnect-expo-cngvhrc4ahere6fp.spaincentral-01.azurewebsites.net/actuator/health/model' \
              -o "${{ runner.temp }}/hireconnect-health.json"; then
              if python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get("status") == "UP" else 1)' "${{ runner.temp }}/hireconnect-health.json"; then
                echo 'Azure listo: Java, MongoDB y el predictor Python responden.'
                exit 0
              fi
            fi
            echo "Esperando el arranque completo ($attempt/36)..."
            sleep 10
          done
          echo 'El servicio no quedo listo. Revisar Log stream; no se considera un despliegue funcional.'
          exit 1
